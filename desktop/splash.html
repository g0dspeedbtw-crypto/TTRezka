<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>TikCut Studio — Запуск...</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #08090f;
      color: #f3f5fc;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      user-select: none;
      -webkit-app-region: drag;
    }
    .logo {
      width: 78px;
      height: 78px;
      border-radius: 22px;
      background: linear-gradient(135deg, #ff2e93, #7c5cff, #00e5ff);
      display: grid;
      place-items: center;
      font-size: 32px;
      font-weight: 900;
      box-shadow: 0 12px 36px rgba(124, 92, 255, 0.45);
    }
    h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.4px; }
    p { font-size: 13.5px; color: #98a2bd; }
    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top-color: #00e5ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #err {
      max-width: 520px;
      color: #ff8fa3;
      font-size: 12.5px;
      text-align: center;
      padding: 0 20px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="logo">▶</div>
  <h1>TikCut Studio</h1>
  <div class="spinner" id="sp"></div>
  <p id="status">Запуск локального ИИ-движка...</p>
  <div id="err"></div>
</body>
</html>
